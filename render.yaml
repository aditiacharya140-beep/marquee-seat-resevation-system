# Render blueprint: the web service and its database, reproducible from the repository
# rather than from console clicks (mds/13-deployment.md).
#
# The image's entrypoint runs `alembic upgrade head` before uvicorn, so a deploy
# cannot forget its migration, and a failed migration fails the deploy.

databases:
  - name: seat-reservation-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: seatres
    user: seatres

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    # Readiness, so a deploy whose database is unreachable never takes traffic. The
    # image's own HEALTHCHECK stays on /healthz: liveness must not touch a dependency.
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The demo's admin sign-in, published in the README on purpose so a reviewer can
      # create a show and open the admin console. A real deployment sets these as
      # secrets instead (`sync: false`). The password is re-applied at every start.
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: seat-admin-2026
      # Demo configuration: no rate limiting, so a load test from one machine sees 201
      # and 409 and never 429; hour-long tokens, so a long run keeps its tokens.
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "3600"
      - key: ALLOWED_EVENT_KINDS
        value: cinema,concert
      - key: DEFAULT_EVENT_KIND
        value: cinema
      - key: DEFAULT_CURRENCY
        value: INR
      # Sized against the database's connection ceiling, not request concurrency: a
      # pool larger than the server can serve turns queueing into refusals.
      - key: DB_POOL_MAX
        value: "20"
      # Used only if limiting is switched on. Guest issuance per client address: same
      # sustained rate as the 60/60s default, with a deeper bucket for `burst.sh`.
      - key: RATE_LIMIT_GUEST
        value: 600/600s
      # Proxies in front of the service: the client address is read this many entries
      # from the right of X-Forwarded-For. On Render it is 3, established by test
      # (LEARN-018): 1 resolves to the platform's internal address, 2 to an address
      # that changes per request. Re-verify with a 429, whose details name the
      # address the limit was applied to, if the platform's edge ever changes.
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        value: "3"
