[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-reservation"
version = "0.1.0"
description = "Assigned-seat reservation service for ticketed events"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "alembic==1.14.1",
    "sqlalchemy==2.0.37",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "prometheus-client==0.21.1",
    "orjson==3.10.15",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "S", "RET", "ARG", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The module name is fixed by the layout in mds/02-architecture.md; every import of
# it is absolute (`app.core.logging`), so the stdlib module is never shadowed.
"app/core/logging.py" = ["A005"]
"tests/*" = ["S", "ARG"]
"burst/*" = ["S"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["concurrency: tests requiring real parallelism against Postgres"]
