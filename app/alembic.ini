# Lives inside app/ because the runtime image copies app/ and nothing else: at the
# repository root it never reached the container and migrations silently never ran
# (RISK-011).
[alembic]
script_location = %(here)s/db/migrations
# env.py imports `app.*`. The `alembic` console script, unlike `python -m alembic`,
# does not put the working directory on sys.path, so the project root is named here.
prepend_sys_path = %(here)s/..
